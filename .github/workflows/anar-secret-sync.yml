name: Copy existing SVN credentials to Anar Toolkit
on:
  workflow_dispatch:
permissions: {}
jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Copy directly between repository secrets
        env:
          GH_TOKEN: ${{ secrets.ANAR_SECRET_SYNC_TOKEN }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$SVN_USERNAME" = mrnwp
          test -n "$SVN_PASSWORD"
          printf '%s' "$SVN_USERNAME" | gh secret set SVN_USERNAME --repo mehran-mrn/anar-login
          printf '%s' "$SVN_PASSWORD" | gh secret set SVN_PASSWORD --repo mehran-mrn/anar-login
